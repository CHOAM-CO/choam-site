    <h2>Scheherazade</h2>
    <p><strong>An agent for a thousand and one nights · v0.5.0</strong></p>
    <p>Memory stored in plain markdown files you can read and version-control yourself. Scheherazade splits working context into real-time session notes, overnight-compressed journals, weekly human-approved persona evolution, and idle dreams. No opaque vector database: open the files in your editor, edit what she remembers, or back them up with Git anytime.</p>
    <p>Change the brain; keep the soul. Switch between DeepSeek DSH, Claude Code, Codex, and local Ollama or ONNX models whenever newer, faster weights arrive. The models are swappable engines, but the years of context, corrections, and shared history remain permanently anchored to your machine.</p>
    <p>An agent that lives where you actually work. Scheherazade bridges natively to Discord, Slack, and Telegram, while keeping a quiet companion presence in the corner of your desktop. Toggle Call Mode to talk through difficult problems by voice with on-device Korean speech recognition and built-in voice synthesis.</p>
    <p>Run multiple distinct companions on a single computer. Scheherazade 0.5.0 introduces native multi-profile isolation: spawn a second Sera with her own independent memory directory, custom personality, private API tokens, and dedicated chat channels — all running concurrently without cross-contamination.</p>
    <p>Autonomy tempered by nineteen deterministic lifecycle hooks. Scheherazade refuses to hallucinate completion: the built-in rumination gate holds back speculative success claims until independently verified. Hardened credential guards protect your system keychain, while automated cadence clocks orchestrate nightly compression without manual prompting.</p>
    <p><a href="../">All projects</a></p>
