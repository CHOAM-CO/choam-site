    <h2>Scheherazade</h2>
    <p><strong>An agent that takes a thousand and one nights in stride</strong></p>
    <p>You never have to explain yourself twice. The small exchange from yesterday and the working rule you set last month are sorted and kept on your own computer, so the next window opens already knowing how you like things. Say "make me a cheat sheet for the exam" and it already knows which two question types you got wrong last time, and puts those first, without your having to name the unit or what you struggled with.</p>
    <p>No new subscription. Connect the account you already pay for: a Claude or ChatGPT subscription, or Ollama. A paid Claude plan signs in inside the app; Claude Code does not need to be installed. When a new model lands, keep the memory and swap only the brain; your conversations and the way you work stay on your machine.</p>
    <p>Away from the desk, drop a line from your phone and it gets done. Message it on Discord or Slack the way you would ask a friend, or switch on Call Mode and speak. Back at your desk, it is already set up.</p>
