<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>choam</title>
<meta name="description" content="culture must flow">
<link rel="icon" href="assets/mark.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <a class="mk" href="#top" aria-label="choam"><img src="assets/mark.svg" alt="" width="28" height="28"></a>
  <nav>
    <a href="#ai">ai</a>
    <a href="#games">games</a>
    <a href="#contact">contact</a>
  </nav>
</header>

<main id="top">

<section class="hero">
  <p class="tl">culture must flow</p>
  <h1 class="wm">CHOAM</h1>
</section>

<section id="ai" class="panel">
  <p class="tl">ai</p>
  <div class="art"><img src="assets/scheherazade.png" alt="scheherazade app icon"></div>
  <div class="bl">
    <h2>scheherazade</h2>
    <p>beta</p>
    <a class="ln" href="https://github.com/Mino-is-me/scheherazade-releases/releases/latest" target="_blank" rel="noopener">download</a>
  </div>
</section>

<section id="games" class="panel split">
  <p class="tl">games</p>
  <article class="cell game-card ryokan">
    <img class="keyart" src="assets/ryokan-keyart.webp" alt="">
    <div class="bl">
      <h2>donguri ryokan</h2>
      <p>coming soon</p>
    </div>
  </article>
  <article class="cell game-card restaurant">
    <img class="keyart" src="assets/restaurant-keyart.webp" alt="">
    <div class="bl">
      <h2>donguri restaurant</h2>
      <a class="ln" href="https://donguri.run" target="_blank" rel="noopener">play</a>
    </div>
  </article>
</section>

<section id="contact" class="panel contact">
  <p class="tl">contact</p>
  <a class="mail" href="mailto:mino@choam.studio">mino@choam.studio</a>
  <img class="br" src="assets/mark.svg" alt="" width="92" height="92">
</section>

</main>
<script src="main.js"></script>
</body>
</html>
