<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none">
  <defs>
    <radialGradient id="lun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9a362" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#c47a8a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lun-gold" x1="140" y1="110" x2="500" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3ece0"/>
      <stop offset="48%" stop-color="#d9a362"/>
      <stop offset="100%" stop-color="#b8737c"/>
    </linearGradient>
    <linearGradient id="lun-faint" x1="160" y1="160" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ebe5da" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#d9a362" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <circle cx="320" cy="320" r="270" fill="url(#lun-glow)"/>
  <!-- Outer orbital rings -->
  <circle cx="320" cy="320" r="216" stroke="url(#lun-faint)" stroke-width="1.2" stroke-dasharray="4 8"/>
  <circle cx="320" cy="320" r="184" stroke="url(#lun-gold)" stroke-opacity="0.38" stroke-width="1.5"/>
  <!-- Crescent moon (Lunasia) cradling the neural core -->
  <path d="M358 148C262 158 190 239 196 336C202 433 283 504 380 494C316 472 272 410 272 334C272 250 328 178 398 156C385 150 372 147 358 148Z"
        fill="url(#lun-gold)" fill-opacity="0.14" stroke="url(#lun-gold)" stroke-width="3"/>
  <!-- Weight matrix / neural lattice lines -->
  <g stroke="url(#lun-gold)" stroke-opacity="0.55" stroke-width="1.6">
    <line x1="272" y1="246" x2="388" y2="214"/>
    <line x1="258" y1="320" x2="424" y2="286"/>
    <line x1="272" y1="394" x2="412" y2="362"/>
    <line x1="388" y1="214" x2="424" y2="286"/>
    <line x1="424" y1="286" x2="412" y2="362"/>
    <line x1="340" y1="268" x2="412" y2="362"/>
    <line x1="340" y1="268" x2="388" y2="214"/>
    <line x1="340" y1="268" x2="352" y2="388"/>
  </g>
  <!-- Pulse / Heartbeat trace across the center -->
  <path d="M148 320H242L264 292L288 358L316 238L344 396L370 278L392 338L412 320H492"
        stroke="url(#lun-gold)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Highlighted persona neuron nodes -->
  <circle cx="316" cy="238" r="7" fill="#050506" stroke="#f3ece0" stroke-width="3"/>
  <circle cx="344" cy="396" r="6.5" fill="#050506" stroke="#d9a362" stroke-width="2.8"/>
  <circle cx="388" cy="214" r="5.5" fill="#d9a362"/>
  <circle cx="424" cy="286" r="6.5" fill="#f3ece0"/>
  <circle cx="412" cy="362" r="5.5" fill="#d9a362"/>
  <!-- Four-point star accent -->
  <path d="M438 176Q440 194 458 196Q440 198 438 216Q436 198 418 196Q436 194 438 176Z" fill="#f3ece0"/>
</svg>
