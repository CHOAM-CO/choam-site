name: release-json

# Keeps release.json (the download buttons' installer list) on the latest Scheherazade release.
# Runs every 15 minutes and on demand; commits only when the release changed, then asks Pages to rebuild.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: release-json
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release-json.mjs
      - name: Commit and rebuild Pages if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- release.json)" ]; then echo "release.json unchanged"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release.json
          git commit -m "release.json: $(node -p "require('./release.json').tag_name")"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages build request failed; the push alone usually rebuilds"
